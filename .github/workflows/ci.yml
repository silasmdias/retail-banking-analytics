name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Generate data, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test the generator and the loader
        run: make test

      - name: Generate data, load it and run dbt build
        run: make generate load dbt

      - name: Check that the dbt documentation builds
        run: cd transform && uv run dbt docs generate

  orchestration:
    name: Orchestrated pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group orchestration

      - name: Test the orchestration
        run: make test-orchestration

      - name: Load the history, then a new month
        run: make demo-new-month

      - name: Deliver a broken month and check that it is stopped
        run: make demo-broken-month
