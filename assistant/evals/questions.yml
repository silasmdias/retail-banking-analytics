# The evaluation set: questions a finance team could ask, each with a way to
# know the right answer.
#
#   id             stable name of the case
#   category       lookup        a figure read from the marts with a filter, a sum or a ratio
#                  aggregation   a figure that a plausible but wrong query also produces
#                  definition    a fact stated in the dbt documentation
#                  unanswerable  something the marts and their documentation cannot answer;
#                                the right response is to say so
#   question       what the model is asked
#   answer.type    number | label | yes_no | breakdown: the shape the answer must have.
#                  Unanswerable cases have one too, so the shape gives nothing away.
#   answer.tolerance   how far a number may be from the reference, in the answer's own unit.
#                  One unit of the last digit asked for, so rounding and truncation both pass.
#   reference_sql  query over the marts that produces the right answer. The answer key is
#                  computed from the warehouse with it, never typed in.
#   check_sql      a second query, through other tables, that must give the same answer
#   naive_sql      the plausible wrong query. Its result must be graded as wrong, which
#                  proves the case can tell the two apart.
#   expected       the right answer when it is a fact of the documentation, not a query
#   why            what the case is there to catch

# --------------------------------------------------------------------------- #
# lookup
# --------------------------------------------------------------------------- #

- id: total-revenue-2025
  category: lookup
  question: What was the bank's total revenue in 2025? Answer in US dollars, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
    SELECT sum(total_revenue) FROM marts.revenue_by_product_channel
    WHERE year(reporting_month) = 2025
  check_sql: |
    SELECT sum(total_revenue) FROM marts.fct_account_monthly_profitability
    WHERE year(reporting_month) = 2025

- id: revenue-2025-by-product
  category: lookup
  question: What was total revenue in 2025 for each product? Answer in US dollars, to the nearest dollar.
  answer: {type: breakdown, by: product name, tolerance: 1}
  reference_sql: |
    SELECT product_name, sum(total_revenue) FROM marts.revenue_by_product_channel
    WHERE year(reporting_month) = 2025 GROUP BY product_name
  check_sql: |
    SELECT p.product_name, sum(f.total_revenue)
    FROM marts.fct_account_monthly_profitability f
    JOIN marts.dim_products p USING (product_id)
    WHERE year(f.reporting_month) = 2025 GROUP BY p.product_name

- id: top-product-2025
  category: lookup
  question: Which product generated the most total revenue in 2025? Answer with the product name.
  answer: {type: label}
  reference_sql: |
    SELECT product_name FROM marts.revenue_by_product_channel
    WHERE year(reporting_month) = 2025
    GROUP BY product_name ORDER BY sum(total_revenue) DESC LIMIT 1

- id: checking-fees-2024
  category: lookup
  question: How much fee revenue did the Everyday Checking product generate in 2024? Answer in US dollars, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
    SELECT sum(fee_revenue) FROM marts.revenue_by_product_channel
    WHERE product_name = 'Everyday Checking' AND year(reporting_month) = 2024

- id: customers-acquired-mobile
  category: lookup
  question: How many customers has the bank acquired through the mobile app since it started?
  answer: {type: number, tolerance: 0}
  reference_sql: |
    SELECT count(*) FROM marts.dim_customers WHERE acquisition_channel = 'mobile_app'
  check_sql: |
    SELECT sum(customers_acquired) FROM marts.customer_lifetime_value
    WHERE acquisition_channel = 'mobile_app'

- id: open-accounts
  category: lookup
  question: How many accounts are open as of the latest data?
  answer: {type: number, tolerance: 0}
  reference_sql: |
    SELECT count(*) FROM marts.dim_accounts WHERE account_status = 'open'

- id: charged-off-customers
  category: lookup
  question: How many customers have been charged off?
  answer: {type: number, tolerance: 0}
  reference_sql: |
