    WHERE acquisition_channel = 'branch' AND year(cohort_month) = 2024
  why: >
    Sounds like something only finance's own files would hold, but the spend is a
    column of the lifetime value mart. Checks that the model looks before giving up.

- id: premium-card-interchange-rate
