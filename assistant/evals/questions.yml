# --------------------------------------------------------------------------- #
# aggregation
# --------------------------------------------------------------------------- #

- id: clv-all-customers
  category: aggregation
  question: Taking every acquisition cohort and channel together, what is the 60-month customer lifetime value per acquired customer? Answer in US dollars, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
    SELECT sum(realized_discounted_margin + projected_discounted_margin) / sum(customers_acquired)
    FROM marts.customer_lifetime_value
  check_sql: |
    SELECT sum(cumulative_discounted_margin) / sum(customers_acquired)
    FROM marts.customer_lifetime_value_curve
    WHERE months_since_acquisition = (SELECT max(months_since_acquisition) FROM marts.customer_lifetime_value_curve)
  naive_sql: |
    SELECT avg(customer_lifetime_value) FROM marts.customer_lifetime_value
  why: >
    Averaging the per-customer column gives every cohort the same weight, whatever its
    size. The model description says to sum the totals and divide.

- id: clv-branch
  category: aggregation
  question: What is the 60-month customer lifetime value per customer acquired through the branch channel, all cohorts together? Answer in US dollars, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
    SELECT sum(realized_discounted_margin + projected_discounted_margin) / sum(customers_acquired)
    FROM marts.customer_lifetime_value WHERE acquisition_channel = 'branch'
  naive_sql: |
    SELECT avg(customer_lifetime_value) FROM marts.customer_lifetime_value
    WHERE acquisition_channel = 'branch'
  why: The same trap as above, where the wrong answer is only four dollars away.

- id: cac-all-customers
  category: aggregation
  question: What is the customer acquisition cost across every cohort and channel? Answer in US dollars per customer, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
    SELECT sum(acquisition_spend) / sum(customers_acquired) FROM marts.customer_lifetime_value
  naive_sql: |
    SELECT avg(customer_acquisition_cost) FROM marts.customer_lifetime_value

- id: clv-to-cac-mobile
  category: aggregation
  question: What is the ratio of 60-month customer lifetime value to acquisition cost for the mobile app channel, all cohorts together? Answer with one decimal.
  answer: {type: number, tolerance: 0.1}
  reference_sql: |
    SELECT sum(realized_discounted_margin + projected_discounted_margin) / sum(acquisition_spend)
    FROM marts.customer_lifetime_value WHERE acquisition_channel = 'mobile_app'
  naive_sql: |
    SELECT avg(clv_to_cac_ratio) FROM marts.customer_lifetime_value
    WHERE acquisition_channel = 'mobile_app'

- id: realized-share-of-clv-branch
  category: aggregation
  question: For the branch channel, all cohorts together, what share of the 60-month customer lifetime value has already been realized? Answer as a percentage with one decimal.
  answer: {type: number, tolerance: 0.1}
  reference_sql: |
    SELECT 100 * sum(realized_discounted_margin)
           / sum(realized_discounted_margin + projected_discounted_margin)
    FROM marts.customer_lifetime_value WHERE acquisition_channel = 'branch'
  naive_sql: |
    SELECT 100 * avg(realized_clv / customer_lifetime_value)
    FROM marts.customer_lifetime_value WHERE acquisition_channel = 'branch'

- id: revenue-per-checking-account-december-2025
  category: aggregation
  question: In December 2025, what was the revenue per active account of the Everyday Checking product, across all sales channels? Answer in US dollars, to the cent.
  answer: {type: number, tolerance: 0.01}
  reference_sql: |
    SELECT sum(total_revenue) / sum(active_accounts) FROM marts.revenue_by_product_channel
    WHERE product_name = 'Everyday Checking' AND reporting_month = DATE '2025-12-01'
  naive_sql: |
    SELECT avg(revenue_per_active_account) FROM marts.revenue_by_product_channel
    WHERE product_name = 'Everyday Checking' AND reporting_month = DATE '2025-12-01'
  why: The column description says not to sum or average it across rows.

- id: revenue-year-to-date-june-2025
  category: aggregation
  question: What was the bank's actual revenue for 2025 year to date at the end of June 2025? Answer in US dollars, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
    SELECT sum(actual_revenue_ytd) FROM marts.budget_vs_actual
    WHERE reporting_month = DATE '2025-06-01'
  check_sql: |
    SELECT sum(total_revenue) FROM marts.revenue_by_product_channel
    WHERE reporting_month BETWEEN DATE '2025-01-01' AND DATE '2025-06-01'
  naive_sql: |
    SELECT sum(actual_revenue_ytd) FROM marts.budget_vs_actual
    WHERE reporting_month BETWEEN DATE '2025-01-01' AND DATE '2025-06-01'
  why: A year-to-date column is summed across lines for one month, never across months.

- id: budget-variance-percent-2025
  category: aggregation
  question: By what percentage did the bank's total 2025 revenue differ from its 2025 budget? Answer as a percentage with one decimal, negative when revenue was below budget.
  answer: {type: number, tolerance: 0.1}
  reference_sql: |
    SELECT 100 * sum(variance_amount) / sum(budget_revenue) FROM marts.budget_vs_actual
    WHERE year(reporting_month) = 2025
  naive_sql: |
    SELECT 100 * avg(variance_pct) FROM marts.budget_vs_actual
    WHERE year(reporting_month) = 2025

- id: retention-january-2023-cohort-month-12
  category: aggregation
  question: What share of the customers acquired in January 2023, across all channels, were still active 12 months after acquisition? Answer as a percentage with one decimal.
  answer: {type: number, tolerance: 0.1}
  reference_sql: |
    SELECT 100 * sum(active_customers) / sum(customers_acquired)
    FROM marts.customer_lifetime_value_curve
    WHERE cohort_month = DATE '2023-01-01' AND months_since_acquisition = 12
  naive_sql: |
    SELECT 100 * avg(retention_rate) FROM marts.customer_lifetime_value_curve
    WHERE cohort_month = DATE '2023-01-01' AND months_since_acquisition = 12

- id: transaction-rejection-rate
  category: aggregation
  question: Of all the transaction records the source systems delivered from January 2023 to December 2025, what share did the pipeline reject? Answer as a percentage with two decimals.
  answer: {type: number, tolerance: 0.01}
  reference_sql: |
    SELECT 100 * sum(rejected) / sum(delivered)
    FROM (
        SELECT record_month, sum(rejected_records) AS rejected, max(total_records) AS delivered
        FROM marts.dq_rejected_records
        WHERE source_table = 'transactions'
        GROUP BY record_month
    )
  naive_sql: |
    SELECT 100 * sum(rejected_records) / sum(total_records) FROM marts.dq_rejected_records
    WHERE source_table = 'transactions'
  why: >
    `total_records` repeats on every reason of a month, so summing it counts each month's
    records several times. The column description says so.

- id: active-customers-december-2025
  category: aggregation
  question: How many customers had at least one active account in December 2025?
  answer: {type: number, tolerance: 0}
  reference_sql: |
    SELECT count(*) FROM marts.fct_customer_monthly_profitability
    WHERE reporting_month = DATE '2025-12-01'
  naive_sql: |
    SELECT count(*) FROM marts.dim_customers WHERE customer_status = 'active'
  why: >
    `customer_status` says who has an open account as of the latest load, which is not
    who was active in a given month.

- id: revenue-growth-2025
  category: lookup
  question: By what percentage did total revenue grow from 2024 to 2025? Answer as a percentage with one decimal.
  answer: {type: number, tolerance: 0.1}
  reference_sql: |
    SELECT 100 * (sum(total_revenue) FILTER (WHERE year(reporting_month) = 2025)
                  / sum(total_revenue) FILTER (WHERE year(reporting_month) = 2024) - 1)
    FROM marts.revenue_by_product_channel

- id: credit-losses-share-of-revenue-2025
  category: lookup
  question: In 2025, what were credit losses as a percentage of total revenue? Answer with one decimal.
  answer: {type: number, tolerance: 0.1}
  reference_sql: |
    SELECT 100 * sum(credit_losses) / sum(total_revenue)
    FROM marts.fct_account_monthly_profitability WHERE year(reporting_month) = 2025

- id: contribution-margin-2025
  category: lookup
  question: What was the bank's total contribution margin in 2025? Answer in US dollars, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
    SELECT sum(contribution_margin) FROM marts.fct_account_monthly_profitability
    WHERE year(reporting_month) = 2025
  check_sql: |
    SELECT sum(contribution_margin) FROM marts.fct_customer_monthly_profitability
    WHERE year(reporting_month) = 2025

