- id: branch-acquisition-spend-2024
  category: lookup
  question: How much did the bank spend on sales and marketing to acquire customers through branches in 2024? Answer in US dollars, to the nearest dollar.
  answer: {type: number, tolerance: 1}
  reference_sql: |
