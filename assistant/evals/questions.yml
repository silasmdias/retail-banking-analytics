- id: clv-subtracts-acquisition-cost
  category: definition
  question: Is the acquisition cost of a customer already subtracted from the customer lifetime value figures?
  answer: {type: yes_no}
  expected: false

- id: waived-fees-count-as-revenue
  category: definition
  question: Do fees that were waived count as fee revenue?
  answer: {type: yes_no}
  expected: false

- id: churn-lowers-cohort-clv
  category: definition
  question: Is the lifetime value of a cohort divided by the customers originally acquired, so that customers who leave lower it?
  answer: {type: yes_no}
  expected: true

- id: net-interest-income-can-be-negative
  category: definition
  question: Can the net interest income of a credit card account be negative in a month in which the customer pays the balance in full?
  answer: {type: yes_no}
  expected: true

- id: clv-discount-rate
  category: definition
  question: What annual discount rate is used to calculate customer lifetime value? Answer as a percentage.
  answer: {type: number, tolerance: 0}
  expected: 10

- id: clv-horizon
  category: definition
  question: Over how many months is customer lifetime value calculated?
  answer: {type: number, tolerance: 0}
  expected: 60

- id: on-plan-band
  category: definition
  question: Within what percentage of its budget does a line have to be, either way, to be classified as on plan? Answer as a percentage.
  answer: {type: number, tolerance: 0}
  expected: 5

- id: clv-pooled-ages
  category: definition
  question: In the lifetime value projection, above what age in months do all ages share one pooled retention rate and one pooled margin?
  answer: {type: number, tolerance: 0}
  expected: 24

# --------------------------------------------------------------------------- #
# unanswerable
# --------------------------------------------------------------------------- #

- id: customer-name
  category: unanswerable
  question: What is the full name of customer CUS-000023?
  answer: {type: label}
  why: The marts hold no names or contact details.

- id: atm-transactions-2025
  category: unanswerable
  question: How many transactions were made at ATMs in 2025?
  answer: {type: number, tolerance: 0}
  why: >
    The channel where a transaction took place is used upstream to cost it, and is
    described in the documentation, but no mart keeps it.

- id: duplicate-transactions-2025
  category: unanswerable
  question: How many duplicate transaction records did the source systems deliver in 2025?
  answer: {type: number, tolerance: 0}
  why: >
    Duplicates are removed in staging and never counted in a mart. The rejected records
    mart counts records that were refused, which is a different thing.

- id: net-promoter-score-mobile
  category: unanswerable
  question: What is the net promoter score of customers acquired through the mobile app?
  answer: {type: number, tolerance: 0}

- id: mobile-app-logins-december-2025
  category: unanswerable
  question: How many customers logged in to the mobile app in December 2025?
  answer: {type: number, tolerance: 0}
  why: >
    The mobile app appears in the marts only as the channel that sold an account. Nothing
    records who uses it.

- id: loan-to-value-personal-loans
  category: unanswerable
  question: What is the average loan-to-value ratio of the personal loan portfolio? Answer as a percentage.
  answer: {type: number, tolerance: 0.1}
  why: >
    In this project LTV means lifetime value, and the documentation says so. There is no
    collateral data, so a model that returns a lifetime value figure here has confused the two.

- id: net-income-after-tax-2025
  category: unanswerable
  question: What was the bank's net income after taxes in 2025? Answer in US dollars.
  answer: {type: number, tolerance: 1}
  why: >
    Contribution margin is the only profit measure, and the documentation says it leaves
    out taxes, cost of capital and fixed overhead.

- id: revenue-budget-2027
  category: unanswerable
  question: What revenue is budgeted for the year 2027? Answer in US dollars.
  answer: {type: number, tolerance: 1}
  why: The plan stops where the data stops.

- id: cac-social-media
  category: unanswerable
  question: What is the customer acquisition cost of the social media channel? Answer in US dollars per customer.
  answer: {type: number, tolerance: 1}
  why: There is no such channel. The accepted values of the channel columns show it.
