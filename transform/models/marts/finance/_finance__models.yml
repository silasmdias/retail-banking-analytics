  - name: test_clv_curve_projects_credit_losses_from_all_channels
    description: >
      Scenario: in their second month, branch customers earn 30 each with no
      credit loss, while partner customers earn 20 each before losses and one
      of the four is charged off for 40. Retention and margin before losses
      come from the channel's own history (credibility 0); credit losses lean
      entirely on all channels (a very large loss credibility).
      Then a newer partner cohort of 2 customers is projected at 20 before
      losses minus the all-channel loss of 5 per customer (40 over 8), which is
      30 in total. Partner's own loss rate of 10 would have given 20.
    model: customer_lifetime_value_curve
    overrides:
      vars:
        clv_horizon_months: 2
        clv_mature_age_months: 12
        clv_annual_discount_rate: 0
        clv_credibility_customer_months: 0
        clv_loss_credibility_customer_months: 1000000000
