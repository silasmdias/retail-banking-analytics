version: 2

sources:
  - name: finance
    description: >
      Files maintained by the finance team of the fictional bank, loaded as
      text into the `raw_finance` schema. Synthetic data.
    schema: raw_finance
    tables:
      - name: revenue_budget
        description: >
          Annual revenue plan, one row per month, product and sales channel.
          Channel names are typed by hand ("Mobile App"). A product and channel
          pair that was not planned has no row.
        columns:
          - name: budget_month
            description: First day of the planned month.
            data_tests:
              - not_null
          - name: product_id
            description: Product the plan refers to.
            data_tests:
              - not_null
          - name: sales_channel
            description: Sales channel the plan refers to, as typed in the planning workbook.
          - name: budget_revenue
            description: Planned revenue in US dollars, rounded to whole dollars.

      - name: acquisition_spend
        description: >
          Sales and marketing spend to acquire new customers, one row per month
          and sales channel.
        columns:
          - name: spend_month
            description: First day of the month the spend was incurred.
            data_tests:
              - not_null
          - name: sales_channel
            description: Sales channel the spend is attributed to.
            data_tests:
              - not_null
          - name: acquisition_spend
            description: Spend in US dollars.
